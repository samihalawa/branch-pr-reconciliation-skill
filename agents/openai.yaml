interface:
  display_name: "Branch PR Reconciliation"
  short_description: "Manually reconcile every useful change into the default branch, then verify, push, and remove all accounted-for residue"
  default_prompt: "Use $branch-pr-reconciliation-skill autonomously. Track the work in the client-native checklist, not a report file. Inventory every local and remote branch, all PR states, worktrees, dirty changes, stashes, reflog leads, and repo-scoped active-agent evidence. Fully read each open PR and every candidate diff. Never merge, cherry-pick, apply a whole patch, or trust a prior summary; manually reimplement only the still-useful intent against the current default branch. Verify each port, close superseded PRs, remove every safely accounted-for non-default branch/worktree/stash, push normally, and finish only after local and remote default-branch SHAs are identical and no useful work is unaccounted for."
